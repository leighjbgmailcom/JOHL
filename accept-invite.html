<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Accept Invitation | Jordan Oldtimers Hockey League</title>

    <link rel="stylesheet" href="css/style.css?v=20260916c">

</head>

<body>

<header class="site-header">

    <div class="container header-inner">

        <div class="league-brand">

            <img
                src="images/sm_JOHL_LOGO.png"
                alt="Jordan Oldtimers Hockey League"
                class="league-logo"
            >

            <div>

                <h1>Jordan Oldtimers</h1>
                <span>Hockey League</span>

            </div>

        </div>

    </div>

</header>


<main class="container page-content">

    <div class="page-title">

        <p class="eyebrow">WELCOME TO THE LEAGUE</p>

        <h2>Accept Your Invitation</h2>

        <p>
            You've been invited to join the
            <strong>Jordan Oldtimers Hockey League</strong>.
        </p>

    </div>


    <div class="login-card">

        <h3 id="invite-heading">Verifying your invitation...</h3>

        <p id="invite-subtext">
            Hang tight while we confirm your invitation link.
        </p>


        <div id="invite-gate">
            <button id="invite-continue" class="btn btn-primary">
                Accept Invitation
            </button>
        </div>


        <form id="accept-invite-form" style="display:none;">

            <label for="new-password">
                New Password
            </label>

            <input
                type="password"
                id="new-password"
                required
                minlength="6"
                autocomplete="new-password"
            >


            <label for="confirm-password">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirm-password"
                required
                minlength="6"
                autocomplete="new-password"
            >


            <button
                type="submit"
                class="btn btn-primary"
            >
                Activate My Account
            </button>

        </form>


        <p id="invite-message"></p>

    </div>

</main>


<footer>

    <div class="container footer-inner">

        <div>

            <strong>
                Jordan Oldtimers Hockey League
            </strong>

            <p>
                Six teams. One great league.
            </p>

        </div>

        <p>
            © 2026 JOHL
        </p>

    </div>

</footer>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js?v=20260916c"></script>


<script>

const heading = document.getElementById("invite-heading");
const subtext = document.getElementById("invite-subtext");
const gate = document.getElementById("invite-gate");
const continueBtn = document.getElementById("invite-continue");
const form = document.getElementById("accept-invite-form");
const message = document.getElementById("invite-message");

let tokenHash = null;
let tokenType = null;


/*
    This page expects the invite link to point directly here with
    token_hash and type as query params (NOT Supabase's hosted
    /auth/v1/verify redirect link).

    IMPORTANT: we do NOT call verifyOtp() automatically on page load.
    Some corporate email security scanners (notably Microsoft Defender
    Safe Links) don't just fetch a URL to check it -- they render the
    destination page in a sandboxed browser, JavaScript and all. If we
    called verifyOtp() as soon as the page loaded, the scanner itself
    would consume the one-time token before the real person ever saw
    the page, and they'd hit "invalid or expired" on a link they never
    even clicked yet.

    Instead, we only read the token off the URL on load, and wait for
    an explicit button click -- something scanners load/render but
    essentially never simulate -- before spending it.
*/

function readTokenFromUrl() {

    const params = new URLSearchParams(window.location.search);

    tokenHash = params.get("token_hash");
    tokenType = params.get("type");

    // TEMP DIAGNOSTIC LOGGING — remove once the flow is confirmed working.
    console.log("Query params on load:", { tokenHash, tokenType });


    if (!tokenHash || !tokenType) {

        heading.textContent = "Invitation link incomplete";

        subtext.textContent =
            "This link is missing required information. Please use the link exactly as it appears in your invitation email, or request a new invitation.";

        gate.style.display = "none";

        return;

    }

    heading.textContent = "You're Invited!";

    subtext.textContent =
        "Click below to accept your invitation and set a password.";

}


continueBtn.addEventListener("click", async function() {

    continueBtn.disabled = true;
    continueBtn.textContent = "Verifying...";


    const { data, error } =
        await supabaseClient.auth.verifyOtp({
            token_hash: tokenHash,
            type: tokenType
        });

    // TEMP DIAGNOSTIC LOGGING — remove once the flow is confirmed working.
    console.log("verifyOtp() result:", { data, error });


    if (error) {

        heading.textContent = "This invitation couldn't be verified";

        subtext.textContent =
            `${error.message}. Please request a new invitation.`;

        gate.style.display = "none";

        return;

    }


    heading.textContent = "Create Your Password";

    subtext.textContent =
        "Set a password below to finish activating your league account.";

    gate.style.display = "none";


    form.style.display = "";

});


form.addEventListener("submit", async function(event) {

    event.preventDefault();


    const password =
        document.getElementById("new-password").value;

    const confirmPassword =
        document.getElementById("confirm-password").value;


    if (password !== confirmPassword) {

        message.textContent =
            "The passwords do not match.";

        return;

    }


    if (password.length < 6) {

        message.textContent =
            "Your password must be at least 6 characters.";

        return;

    }


    message.textContent =
        "Activating your account...";


    const { data, error } =
        await supabaseClient.auth.updateUser({

            password: password

        });

    // TEMP DIAGNOSTIC LOGGING — remove once the flow is confirmed working.
    console.log("updateUser() result:", { data, error });


    if (error) {

        console.error(error);

        message.textContent =
            `There was a problem activating your account: ${error.message} (status ${error.status ?? "n/a"})`;

        return;

    }


    message.textContent =
        "Your account is ready! Welcome to the Jordan Oldtimers Hockey League.";


    setTimeout(function() {

        window.location.href = "index.html";

    }, 1500);

});


readTokenFromUrl();

</script>

</body>

</html>
