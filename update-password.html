<title>Jordan Oldtimers - Reset Password</title>

<link rel="stylesheet" href="css/style.css?v=20260916d">

<style>
    .password-container {
        max-width: 400px;
        margin: 80px auto;
        padding: 30px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .password-container h1 {
        text-align: center;
        margin-bottom: 10px;
    }

    .password-container p {
        text-align: center;
        margin-bottom: 25px;
    }

    .password-container input {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
    }

    .password-container button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
    }

    #password-message {
        margin-top: 15px;
        text-align: center;
    }

    .back-login {
        display: block;
        margin-top: 20px;
        text-align: center;
    }
</style>
```

</head>

<body>

<div class="password-container">

```
<h1>Reset Password</h1>

<p>Enter your new Jordan Oldtimers password below.</p>

<form id="update-password-form">

    <input
        type="password"
        id="new-password"
        placeholder="New password"
        minlength="6"
        required
    >

    <input
        type="password"
        id="confirm-password"
        placeholder="Confirm new password"
        minlength="6"
        required
    >

    <button type="submit">
        Update Password
    </button>

</form>

<div id="password-message"></div>

<a class="back-login" href="login.html">
    Back to Login
</a>
```

</div>
