<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Players | Jordan Oldtimers Hockey League</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

<header class="site-header">

    <div class="container header-inner">

        <div class="league-brand">

            <div class="league-logo">JOHL</div>

            <div>

                <h1>Jordan Oldtimers</h1>

                <span>Hockey League</span>

            </div>

        </div>


        <nav>

            <a href="index.html">Home</a>

            <a href="schedule.html">Schedule</a>

            <a href="standings.html">Standings</a>

            <a href="teams.html">Teams</a>

            <a href="players.html" class="active">
                Players
            </a>

        </nav>

    </div>

</header>


<main class="container page-content">

    <div class="page-title">

        <p class="eyebrow">2026 SEASON</p>

        <h2>Players</h2>

        <p>
            Player statistics from around the league.
        </p>

    </div>


    <div class="player-controls">

        <input
            type="text"
            id="player-search"
            placeholder="Search player..."
        >


        <select id="player-team">

            <option value="ALL">
                All Teams
            </option>

            <option value="TOR">
                Toronto Maple Leafs
            </option>

            <option value="VAN">
                Vancouver Canucks
            </option>

            <option value="QUE">
                Québec Nordiques
            </option>

            <option value="EDM">
                Edmonton Oilers
            </option>

            <option value="MTL">
                Montréal Canadiens
            </option>

            <option value="OTT">
                Ottawa Senators
            </option>

        </select>

    </div>


    <div class="table-wrapper">

        <table>

            <thead>

                <tr>

                    <th>#</th>
                    <th>Player</th>
                    <th>Team</th>
                    <th>Pos</th>
                    <th>GP</th>
                    <th>G</th>
                    <th>A</th>
                    <th>PTS</th>

                </tr>

            </thead>


            <tbody id="players-table"></tbody>

        </table>

    </div>

</main>


<footer>

    <div class="container footer-inner">

        <div>

            <strong>
                Jordan Oldtimers Hockey League
            </strong>

            <p>
                Six teams. One great league.
            </p>

        </div>

        <p>© 2026 JOHL</p>

    </div>

</footer>


<script src="js/app.js"></script>

</body>

</html>
