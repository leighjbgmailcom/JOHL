<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosters | Jordan Oldtimers Hockey League</title>
    <link rel="stylesheet" href="css/style.css?v=3">
</head>

<body>

<div id="site-header-placeholder"></div>


<main class="container page-content">

    <div class="page-title">
        <p class="eyebrow">2026-27 SEASON</p>
        <h2>Rosters</h2>
        <p>Every player registered across the league. <span id="player-count"></span></p>
    </div>

    <div class="player-controls">

        <input
            type="text"
            id="player-search"
            placeholder="Search player..."
        >

        <select id="player-team">
            <option value="ALL">All Teams</option>
            <option value="TML">Coldbreak Leafs</option>
            <option value="CAN">Keg Canucks</option>
            <option value="NOR">Regatta Nordiques</option>
            <option value="OIL">Dawson's Oilers</option>
            <option value="MTL">Culp Habs</option>
            <option value="SEN">Timbit Senators</option>
        </select>

    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Player</th>
                    <th>Team</th>
                    <th>Position</th>
                </tr>
            </thead>

            <tbody id="players-table"></tbody>
        </table>
    </div>

</main>


<footer>

    <div class="container footer-inner">

        <div>
            <strong>Jordan Oldtimers Hockey League</strong>
            <p>Six teams. One great league.</p>
        </div>

        <p>© 2026 JOHL</p>

    </div>

</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js?v=3"></script>
<script src="js/header.js?v=3"></script>
<script src="js/db.js?v=3"></script>
<script src="js/app.js?v=3"></script>
<script src="js/auth.js?v=3"></script>
<script>
    checkLogin();
</script>

</body>
</html>
