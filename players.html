<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosters | Jordan Oldtimers Hockey League</title>
    <link rel="stylesheet" href="css/style.css?v=20260916d">
</head>

<body>

<header class="site-header">
    <div class="container header-inner">

        <div class="league-brand">
            <img src="images/sm_JOHL_LOGO.png" alt="Jordan Oldtimers Hockey League" class="league-logo">
            <div>
                <h1>Jordan Oldtimers</h1>
                <span>Hockey League</span>
            </div>
        </div>

        <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav id="site-nav">
            <a href="index.html">Home</a>
            <a href="schedule.html">Schedule</a>
            <a href="standings.html" data-protected style="display:none;">Standings</a>
            <a href="teams.html" data-protected style="display:none;">Teams</a>
            <a href="players.html" class="active" data-protected style="display:none;">Rosters</a>
            <a href="admin.html" id="admin-link" style="display:none;">Admin</a>
            <a href="login.html" id="auth-link">Login</a>
        </nav>

    </div>
</header>


<main class="container page-content">

    <div class="page-title">
        <p class="eyebrow">2026-27 SEASON</p>
        <h2>Rosters</h2>
        <p>Every player registered across the league. <span id="player-count"></span></p>
    </div>

    <div class="player-controls">

        <input
            type="text"
            id="player-search"
            placeholder="Search player..."
        >

        <select id="player-team">
            <option value="ALL">All Teams</option>
            <option value="TML">Coldbreak Leafs</option>
            <option value="CAN">Keg Canucks</option>
            <option value="NOR">Regatta Nordiques</option>
            <option value="OIL">Dawson's Oilers</option>
            <option value="MTL">Culp Habs</option>
            <option value="SEN">Timbit Senators</option>
        </select>

    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Player</th>
                    <th>Team</th>
                    <th>Position</th>
                </tr>
            </thead>

            <tbody id="players-table"></tbody>
        </table>
    </div>

</main>


<footer>

    <div class="container footer-inner">

        <div>
            <strong>Jordan Oldtimers Hockey League</strong>
            <p>Six teams. One great league.</p>
        </div>

        <p>© 2026 JOHL</p>

    </div>

</footer>

<!-- LOGIN MODAL -->

<div class="modal-overlay" id="login-modal">

    <div class="modal-card">

        <button class="modal-close" id="login-modal-close" aria-label="Close">&times;</button>

        <h3>League Members Login</h3>

        <form id="modal-login-form">

            <label for="modal-email">Email</label>
            <input type="email" id="modal-email" required autocomplete="email">

            <label for="modal-password">Password</label>
            <input type="password" id="modal-password" required autocomplete="current-password">

            <button type="submit" class="btn btn-primary">Login</button>

            <p id="modal-login-message"></p>

        </form>

        <p class="modal-footer-link">
            <button type="button" id="forgot-password-link" class="link-button">Forgot your password?</button>
        </p>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js?v=20260916d"></script>
<script src="js/db.js?v=20260916d"></script>
<script src="js/app.js?v=20260916d"></script>
<script src="js/auth.js?v=20260916d"></script>

<script>
    checkLogin();
</script>

</body>
</html>
