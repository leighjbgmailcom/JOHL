<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jordan Oldtimers - Login</title>

    <link rel="stylesheet" href="css/style.css?v=20260916h">

    <style>
        .login-container {
            max-width: 400px;
            margin: 80px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .login-container h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-container input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .login-container button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        #login-message {
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="login-container">

    <h1>Jordan Oldtimers</h1>

    <p style="text-align:center;">
        League Members Login
    </p>

    <form id="login-form">

        <input
            type="email"
            id="email"
            placeholder="Email address"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <div id="login-message"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js?v=20260916h"></script>
<script src="js/auth.js?v=20260916h"></script>

</body>
</html>
