<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Admin | Jordan Oldtimers Hockey League</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .admin-panel {
            background: white;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 3px 15px rgba(0,0,0,.07);
            margin-bottom: 30px;
        }

        .admin-panel h3 {
            margin-bottom: 18px;
        }

        .admin-form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        .admin-form-grid label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #45525c;
            margin-bottom: 6px;
        }

        .admin-form-grid input,
        .admin-form-grid select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccd3d9;
            border-radius: 4px;
            font-size: 14px;
        }

        .admin-checkbox-field {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .admin-checkbox-field label {
            font-weight: bold;
            font-size: 14px;
        }

        .admin-form-actions {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .link-button {
            background: none;
            border: none;
            color: #c8102e;
            font-weight: bold;
            cursor: pointer;
            padding: 0;
            margin-right: 12px;
            font-size: 13px;
        }

        .link-button:hover {
            text-decoration: underline;
        }

        .link-button.danger {
            color: #75818b;
        }

        #game-form-message {
            font-size: 13px;
            color: #45525c;
        }
    </style>
</head>

<body>

<header class="site-header">
    <div class="container header-inner">

        <div class="league-brand">
            <img src="images/sm_JOHL_LOGO.png" alt="Jordan Oldtimers Hockey League" class="league-logo">
            <div>
                <h1>Jordan Oldtimers</h1>
                <span>Hockey League</span>
            </div>
        </div>

        <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav id="site-nav">
            <a href="index.html">Home</a>
            <a href="schedule.html">Schedule</a>
            <a href="standings.html">Standings</a>
            <a href="teams.html">Teams</a>
            <a href="players.html">Rosters</a>
            <a href="admin.html" class="active">Admin</a>
            <a href="#" id="admin-logout-link">Logout</a>
        </nav>

    </div>
</header>


<main class="container page-content" id="admin-page-content" style="display:none;">

    <div class="page-title">
        <p class="eyebrow">ADMIN</p>
        <h2>Schedule Management</h2>
        <p>Add, edit or remove games on the 2026-27 schedule.</p>
    </div>


    <div class="admin-panel" id="game-form-panel">

        <h3 id="game-form-title">Add a Game</h3>

        <form id="game-form">

            <input type="hidden" id="game-id">

            <div class="admin-form-grid">

                <div>
                    <label for="game-date">Date</label>
                    <input type="date" id="game-date" required>
                </div>

                <div>
                    <label for="game-time">Time</label>
                    <input type="time" id="game-time">
                </div>

                <div>
                    <label for="game-location">Location</label>
                    <input type="text" id="game-location" value="Jordan Arena">
                </div>

                <div>
                    <label for="game-no">Game #</label>
                    <input type="number" id="game-no" min="1">
                </div>

            </div>

            <div class="admin-checkbox-field">
                <input type="checkbox" id="game-no-games">
                <label for="game-no-games">This is a bye week / no games this day</label>
            </div>

            <div class="admin-form-grid">

                <div class="game-teams-field">
                    <label for="game-away-team">Away Team</label>
                    <select id="game-away-team"></select>
                </div>

                <div class="game-teams-field">
                    <label for="game-home-team">Home Team</label>
                    <select id="game-home-team"></select>
                </div>

                <div>
                    <label for="game-note">Note (optional)</label>
                    <input type="text" id="game-note" placeholder="e.g. Playoffs Game 1">
                </div>

                <div>
                    <label for="game-status">Status</label>
                    <select id="game-status">
                        <option value="scheduled">Scheduled</option>
                        <option value="final">Final</option>
                    </select>
                </div>

            </div>

            <div class="admin-form-grid" id="game-score-fields" style="display:none;">

                <div>
                    <label for="game-away-score">Away Score</label>
                    <input type="number" id="game-away-score" min="0">
                </div>

                <div>
                    <label for="game-home-score">Home Score</label>
                    <input type="number" id="game-home-score" min="0">
                </div>

            </div>

            <div class="admin-form-actions">
                <button type="submit" class="button">Save Game</button>
                <button type="button" id="game-form-cancel" class="link-button">Cancel / New Game</button>
                <span id="game-form-message"></span>
            </div>

        </form>

    </div>


    <div class="admin-panel">

        <h3>All Games</h3>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Matchup</th>
                        <th>Status</th>
                        <th>Score</th>
                        <th>Game #</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="admin-games-table"></tbody>
            </table>
        </div>

    </div>

</main>


<footer>

    <div class="container footer-inner">

        <div>
            <strong>Jordan Oldtimers Hockey League</strong>
            <p>Six teams. One great league.</p>
        </div>

        <p>© 2026 JOHL</p>

    </div>

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin.js"></script>

<script>
    document.getElementById("admin-logout-link").addEventListener("click", function(event) {
        event.preventDefault();
        logout();
    });
</script>

</body>
</html>
