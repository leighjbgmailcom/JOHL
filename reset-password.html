<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Jordan Oldtimers Hockey League</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="site-header">

    <div class="container header-inner">

        <div class="league-brand">

            <img
                src="images/sm_JOHL_LOGO.png"
                alt="Jordan Oldtimers Hockey League"
                class="league-logo"
            >

            <div>

                <h1>Jordan Oldtimers</h1>
                <span>Hockey League</span>

            </div>

        </div>

    </div>

</header>


<main class="container page-content">

    <div class="page-title">

        <p class="eyebrow">ACCOUNT ACCESS</p>

        <h2>Reset Your Password</h2>

        <p>
            Set a new password for your
            <strong>Jordan Oldtimers Hockey League</strong> account.
        </p>

    </div>


    <div class="login-card">

        <h3 id="reset-heading">Verifying your reset link...</h3>

        <p id="reset-subtext">
            Hang tight while we confirm your password reset link.
        </p>


        <form id="reset-password-form" style="display:none;">

            <label for="new-password">
                New Password
            </label>

            <input
                type="password"
                id="new-password"
                required
                minlength="6"
                autocomplete="new-password"
            >


            <label for="confirm-password">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirm-password"
                required
                minlength="6"
                autocomplete="new-password"
            >


            <button
                type="submit"
                class="btn btn-primary"
            >
                Reset Password
            </button>

        </form>


        <p id="reset-message"></p>

    </div>

</main>


<footer>

    <div class="container footer-inner">

        <div>

            <strong>
                Jordan Oldtimers Hockey League
            </strong>

            <p>
                Six teams. One great league.
            </p>

        </div>

        <p>
            © 2026 JOHL
        </p>

    </div>

</footer>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>


<script>

const heading = document.getElementById("reset-heading");
const subtext = document.getElementById("reset-subtext");
const form = document.getElementById("reset-password-form");
const message = document.getElementById("reset-message");


/*
    Same pattern as accept-invite.html: this page expects the recovery
    link to point directly here with token_hash and type as query
    params, and verifies the token itself client-side rather than
    relying on Supabase's hosted /auth/v1/verify redirect. This avoids
    email security scanners consuming the one-time token before the
    real person clicks the link.
*/

async function verifyRecovery() {

    const params = new URLSearchParams(window.location.search);

    const tokenHash = params.get("token_hash");
    const type = params.get("type");

    // TEMP DIAGNOSTIC LOGGING — remove once the flow is confirmed working.
    console.log("Query params on load:", { tokenHash, type });


    if (!tokenHash || !type) {

        heading.textContent = "Reset link incomplete";

        subtext.textContent =
            "This link is missing required information. Please use the link exactly as it appears in your email, or request a new password reset.";

        return;

    }


    const { data, error } =
        await supabaseClient.auth.verifyOtp({
            token_hash: tokenHash,
            type: type
        });

    // TEMP DIAGNOSTIC LOGGING — remove once the flow is confirmed working.
    console.log("verifyOtp() result:", { data, error });


    if (error) {

        heading.textContent = "This reset link couldn't be verified";

        subtext.textContent =
            `${error.message}. Please request a new password reset.`;

        return;

    }


    heading.textContent = "Create a New Password";

    subtext.textContent =
        "Choose a new password below to regain access to your account.";

    form.style.display = "";

}


form.addEventListener("submit", async function(event) {

    event.preventDefault();


    const password =
        document.getElementById("new-password").value;

    const confirmPassword =
        document.getElementById("confirm-password").value;


    if (password !== confirmPassword) {

        message.textContent =
            "The passwords do not match.";

        return;

    }


    if (password.length < 6) {

        message.textContent =
            "Your password must be at least 6 characters.";

        return;

    }


    message.textContent =
        "Updating your password...";


    const { data, error } =
        await supabaseClient.auth.updateUser({

            password: password

        });

    // TEMP DIAGNOSTIC LOGGING — remove once the flow is confirmed working.
    console.log("updateUser() result:", { data, error });


    if (error) {

        console.error(error);

        message.textContent =
            `There was a problem resetting your password: ${error.message} (status ${error.status ?? "n/a"})`;

        return;

    }


    message.textContent =
        "Your password has been reset! Redirecting you to sign in...";


    setTimeout(function() {

        window.location.href = "index.html";

    }, 1500);

});


verifyRecovery();

</script>

</body>

</html>
