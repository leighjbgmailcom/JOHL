<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Jordan Oldtimers Hockey League</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="site-header">

    <div class="container header-inner">

        <div class="league-brand">

            <img
                src="images/sm_JOHL_LOGO.png"
                alt="Jordan Oldtimers Hockey League"
                class="league-logo"
            >

            <div>

                <h1>Jordan Oldtimers</h1>
                <span>Hockey League</span>

            </div>

        </div>

    </div>

</header>


<main class="container page-content">

    <div class="page-title">

        <p class="eyebrow">ACCOUNT ACCESS</p>

        <h2>Reset Your Password</h2>

        <p>
            Set a new password for your
            <strong>Jordan Oldtimers Hockey League</strong> account.
        </p>

    </div>


    <div class="login-card">

        <h3>Create a New Password</h3>

        <p>
            Choose a new password below to regain access to your account.
        </p>


        <form id="reset-password-form">

            <label for="new-password">
                New Password
            </label>

            <input
                type="password"
                id="new-password"
                required
                minlength="6"
                autocomplete="new-password"
            >


            <label for="confirm-password">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirm-password"
                required
                minlength="6"
                autocomplete="new-password"
            >


            <button
                type="submit"
                class="btn btn-primary"
            >
                Reset Password
            </button>


            <p id="reset-message"></p>

        </form>

    </div>

</main>


<footer>

    <div class="container footer-inner">

        <div>

            <strong>
                Jordan Oldtimers Hockey League
            </strong>

            <p>
                Six teams. One great league.
            </p>

        </div>

        <p>
            © 2026 JOHL
        </p>

    </div>

</footer>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>


<script>

const form = document.getElementById("reset-password-form");

const message = document.getElementById("reset-message");


/*
    The recovery link creates a Supabase
    authentication session automatically
    (Supabase fires a PASSWORD_RECOVERY event).

    We wait for that session before allowing
    the player to set a new password.
*/

async function checkRecoverySession() {

    // TEMP DIAGNOSTIC LOGGING — remove once the flow is confirmed working.
    console.log("URL hash on load:", window.location.hash);

    const {
        data: { session },
        error
    } = await supabaseClient.auth.getSession();

    console.log("getSession() result:", { session, error });


    if (error || !session) {

        message.textContent = error
            ? `This password reset link couldn't be verified: ${error.message}`
            : "This password reset link is invalid or has expired. Please request a new one.";

        form.style.display = "none";

        return false;

    }

    return true;

}


form.addEventListener("submit", async function(event) {

    event.preventDefault();


    const password =
        document.getElementById("new-password").value;

    const confirmPassword =
        document.getElementById("confirm-password").value;


    if (password !== confirmPassword) {

        message.textContent =
            "The passwords do not match.";

        return;

    }


    if (password.length < 6) {

        message.textContent =
            "Your password must be at least 6 characters.";

        return;

    }


    message.textContent =
        "Updating your password...";


    const { data, error } =
        await supabaseClient.auth.updateUser({

            password: password

        });

    // TEMP DIAGNOSTIC LOGGING — remove once the flow is confirmed working.
    console.log("updateUser() result:", { data, error });


    if (error) {

        console.error(error);

        message.textContent =
            `There was a problem resetting your password: ${error.message} (status ${error.status ?? "n/a"})`;

        return;

    }


    message.textContent =
        "Your password has been reset! Redirecting you to sign in...";


    setTimeout(function() {

        window.location.href = "index.html";

    }, 1500);

});


checkRecoverySession();

</script>

</body>

</html>
