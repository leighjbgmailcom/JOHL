<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#071a2b">
    <link rel="apple-touch-icon" href="images/icons/apple-touch-icon.png">
    <link rel="icon" href="images/icons/icon-192.png">
    <title>Schedule | Jordan Oldtimers Hockey League</title>
    <link rel="stylesheet" href="css/style.css?v=13">
</head>

<body>

<div id="site-header-placeholder"></div>


<main class="container page-content">

    <div class="page-title">
        <p class="eyebrow">2026-27 SEASON</p>
        <h2>Schedule</h2>
        <p>Every Jordan Oldtimers Hockey League game, Sept 27, 2026 through the April 4, 2027 finals — all at Jordan Arena.</p>
    </div>

    <div class="filter-buttons">
        <button class="filter-button active" data-team="ALL">All Teams</button>
        <button class="filter-button" data-team="TML">Maple Leafs</button>
        <button class="filter-button" data-team="CAN">Canucks</button>
        <button class="filter-button" data-team="NOR">Nordiques</button>
        <button class="filter-button" data-team="OIL">Oilers</button>
        <button class="filter-button" data-team="MTL">Canadiens</button>
        <button class="filter-button" data-team="SEN">Senators</button>
    </div>

    <div class="schedule-print-bar">
        <button type="button" class="button" id="schedule-print-button">🖨️ Print / Export Full Schedule</button>
    </div>

    <div class="schedule-layout">
        <div class="schedule-main">
            <div id="schedule-list"></div>
        </div>

        <aside class="schedule-roster-panel" id="schedule-roster-panel" style="display:none;">
            <h4 id="schedule-roster-team-name"></h4>
            <div id="schedule-roster-list"></div>
        </aside>
    </div>

</main>


<footer>

    <div class="container footer-inner">

        <div>
            <strong>Jordan Oldtimers Hockey League</strong>
            <p>Six teams. One great league.</p>
        </div>

        <p>© 2026 JOHL</p>

    </div>

</footer>

<div id="schedule-print-sheet"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js?v=13"></script>
<script src="js/header.js?v=13"></script>
<script src="js/install.js?v=13"></script>
<script src="js/db.js?v=13"></script>
<script src="js/app.js?v=13"></script>
<script src="js/auth.js?v=13"></script>
<!--
<script>
    checkLogin();
</script>
-->
<script>
    document.getElementById("schedule-print-button").addEventListener("click", printFullSchedule);
</script>

</body>
</html>
